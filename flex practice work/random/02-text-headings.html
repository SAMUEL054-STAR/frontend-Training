<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text and Headings</title>
  </head>
  <body>

    <!-- Headings: h1 is the most important, h6 the least -->
    <!-- Rule: only ONE h1 per page -->
    <h1>I am the page title (only one of me!)</h1>
    <h2>I am a section title</h2>
    <h3>I am a sub-section title</h3>

    <!-- Paragraphs -->
    <p>This is a normal paragraph. Lorem ipsum dolor sit amet.</p>

    <!-- Strong = important (bold). Em = emphasis (italic) -->
    <p>This word is <strong>very important</strong> and this one is <em>just emphasised</em>.</p>

    <!-- PRACTICE TASK:
      1. Change the h1 to your own name
      2. Add an h2 that says "About Me"
      3. Write a short paragraph about yourself underneath it
      4. Make one word in the paragraph bold using <strong>
    -->

  </body>
</html>
