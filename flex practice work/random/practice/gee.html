<!doctype html>
<html>
  <head>

      .card {
        width: 300px;
        height: 300px;
        background-color: bisque;
        border: 20px solid bisque;
        border-radius: 20px;
      }
      .cta {
        width: 100px;
        height: 20px;
        background-color: blue;
        border-radius: 5px;
        text-decoration: none;
        justify-content: center;
        margin-top: 70px;
        margin-left: 50px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div>
        <h1>🎨</h1>
      </div>
      <div>
        <h1>Hello World</h1>
        <p>A Short Description of something intresting and useful</p>
      </div>
      <div class="cta">
        <a>learn more</a>
      </div>
    </div>
  </body>
</html>
