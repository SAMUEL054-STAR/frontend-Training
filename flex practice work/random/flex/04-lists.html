<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lists</title>
  </head>
  <body>

    <h1>Lists</h1>

    <!-- Unordered list: order does not matter (bullet points) -->
    <h2>My hobbies</h2>
    <ul>
      <li>Reading</li>
      <li>Coding</li>
      <li>Gaming</li>
    </ul>

    <!-- Ordered list: order matters (numbered) -->
    <h2>How to make tea</h2>
    <ol>
      <li>Boil water</li>
      <li>Put the teabag in the cup</li>
      <li>Pour the water</li>
      <li>Wait 3 minutes</li>
      <li>Remove the teabag and enjoy</li>
    </ol>

    <!-- Nested list: a list inside a list -->
    <h2>Things I want to learn</h2>
    <ul>
      <li>Frontend
        <ul>
          <li>HTML</li>
          <li>CSS</li>
          <li>JavaScript</li>
        </ul>
      </li>
      <li>Backend</li>
    </ul>

    <!-- PRACTICE TASK:
      1. Create an unordered list of 4 things you like
      2. Create an ordered list of your top 3 favourite films (in order)
      3. Inside one of your unordered list items, add a nested list
         with 2 sub-items
    -->

  </body>
</html>
