<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links and Images</title>
  </head>
  <body>

    <h1>Links and Images</h1>

    <!-- Basic link -->
    <p>Visit <a href="https://www.google.com">Google</a> for searching.</p>

    <!-- Link that opens in a new tab -->
    <p>Visit <a href="https://www.google.com" target="_blank">Google (new tab)</a>.</p>

    <!-- Link to another page in the same project -->
    <p>Go to my <a href="about.html">About page</a>.</p>

    <!-- Link to a section on the same page using an id -->
    <p><a href="#contact">Jump to contact section</a></p>

    <!-- Image: src is the file path, alt describes the image for screen readers -->
    <!-- Always write meaningful alt text — not just "image" -->
    <img src="https://placehold.co/400x200" alt="A placeholder image showing a grey rectangle">

    <!-- Section the jump link points to -->
    <section id="contact">
      <h2>Contact</h2>
      <p>You jumped here from the link above!</p>
    </section>

    <!-- PRACTICE TASK:
      1. Create a link to your favourite website
      2. Make it open in a new tab
      3. Add an image below it (you can use https://placehold.co/300x150 as the src)
      4. Write a proper alt description for the image
    -->

  </body>
</html>
